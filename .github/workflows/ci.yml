# Lint, typecheck, unit tests and build on every push and pull request; the Playwright suite against a
# production build with MongoDB and Mailpit as service containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:8
        env:
          # See docker-compose.yml (SERVER-121912); harmless on kernels that don't need it.
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
      mailpit:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_DISABLE_RDNS: "true"
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
